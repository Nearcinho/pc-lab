<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="titanBg" x1="0" y1="0" x2="600" y2="600">
      <stop stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#14142a"/>
    </linearGradient>
    <linearGradient id="titanGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#titanBg)"/>
  <circle cx="300" cy="300" r="230" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="300" cy="300" r="180" stroke="#8b5cf6" stroke-opacity="0.15" stroke-width="1"/>
  <!-- Tower -->
  <rect x="180" y="120" width="240" height="360" rx="18" fill="#202038" stroke="#3a3a55"/>
  <rect x="196" y="136" width="208" height="170" rx="12" fill="#0e0e1c" stroke="#2c2c46"/>
  <!-- RGB fans -->
  <g stroke="url(#titanGlass)" stroke-width="6" fill="none">
    <circle cx="300" cy="180" r="34"/>
    <circle cx="256" cy="172" r="22" opacity="0.6"/>
    <circle cx="344" cy="172" r="22" opacity="0.6"/>
  </g>
  <path d="M300 180 l-10 -10 h20 z" fill="#67e8f9"/>
  <!-- GPU -->
  <rect x="140" y="330" width="320" height="70" rx="10" fill="#1a1a28" stroke="url(#titanGlass)" stroke-width="2"/>
  <rect x="160" y="345" width="280" height="8" rx="4" fill="#22d3ee"/>
  <g stroke="#22d3ee" stroke-width="4">
    <circle cx="210" cy="360" r="18" fill="none" opacity="0.8"/>
    <circle cx="390" cy="360" r="18" fill="none" opacity="0.8"/>
  </g>
  <!-- PSU -->
  <rect x="200" y="420" width="120" height="48" rx="8" fill="#10101c" stroke="#33334d" stroke-width="2"/>
  <rect x="210" y="432" width="80" height="18" rx="4" stroke="#8b5cf6" stroke-width="2"/>
  <!-- cables glow -->
  <path d="M180 420 v-20 h14" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="3" fill="none"/>
  <path d="M414 396 v24 h20" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="3" fill="none"/>
  <text x="300" y="560" text-anchor="middle" fill="#e8eaf2" font-family="Arial" font-size="22" font-weight="700" letter-spacing="8">NEXA TITAN</text>
</svg>